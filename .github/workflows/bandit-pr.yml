---
name: Security check - Bandit

on:
  pull_request:

permissions: read-all

jobs:
  bandit-on-repo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.14"
    - run: uv sync
    - name: bandit via uv
      run: uv run bandit -c pyproject.toml -r src

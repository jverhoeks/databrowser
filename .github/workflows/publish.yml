---
# Single release pipeline: on a merge to main this bumps the version, pushes the
# tag, builds, and publishes to PyPI. Doing it in one workflow run avoids two
# long-standing problems with the old split setup:
#   * a tag pushed by GITHUB_TOKEN never triggers a separate `on: push`/`on: release`
#     workflow, so merges never actually published;
#   * publishing on both `release: published` and `push: tags` caused duplicate,
#     racing publish runs.
# The workflow file is kept named `publish.yml` so the PyPI trusted-publisher
# configuration (which is keyed on the workflow filename) stays valid.
#
# The third-party tag-bump action runs in its own job that does NOT have
# `id-token: write`, so it can never reach the PyPI OIDC token, and it is pinned
# by commit SHA. The publish job (which holds `id-token: write`) runs only
# first-party actions plus uv.
#
# Add `#none` to the merge commit message to release nothing; `#minor` / `#major`
# to bump more than a patch.
name: publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    # Only on a real merge (skip PRs that are closed without merging).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the version tag
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      old_tag: ${{ steps.tag.outputs.old_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag
        # anothrNick/github-tag-action@1.75.0, pinned by commit SHA (supply-chain).
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

  publish:
    needs: tag
    # Publish only when a genuinely NEW tag was created (#none leaves new_tag == old_tag).
    if: needs.tag.outputs.new_tag != '' && needs.tag.outputs.new_tag != needs.tag.outputs.old_tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out the new tag
        # Guarantees HEAD == tag so hatch-vcs produces a clean release version
        # (not a 0.x.devN+g<sha> that pip would ignore on install).
        run: |
          git fetch --tags --force
          git checkout "${{ needs.tag.outputs.new_tag }}"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.tag.outputs.new_tag }}" --verify-tag --generate-notes

---
name: Python

on:
  pull_request:

permissions: read-all

jobs:
  python-pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.14"
    - run: uv sync
    - name: pylint via uv
      run: uv run pylint src/

  python-pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.14"
    - run: uv sync
    - name: pytest via uv
      run: uv run pytest

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "databrowser"
dynamic = ["version"]
description = "Quick tool to browse and view data files (json,csv,parquet,more) on local disk and s3"
authors = [{ name = "Jacob Verhoeks", email = "jacob.verhoeks@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "s3fs>=2026.4.0",
    "s3path>=0.6.2",
    "pandas>=3.0.0",
    "textual>=8.2.0",
    "pyarrow>=24.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.2",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.1.0",
    "html5lib>=1.1",
]

[project.urls]
repository = "https://github.com/jverhoeks/databrowser"

[project.scripts]
databrowser = "databrowser.data_browser:run"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23",
    "pylint>=4.0.0",
    "black>=26.5.1",
    "bandit>=1.8.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/databrowser"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.bandit]
targets = ["src"]
skips = ["B101"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
